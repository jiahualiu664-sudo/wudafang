name: 五道方 V8 教师数据

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '教师数据模式'
        required: true
        default: 'check'
        type: choice
        options:
          - 'check'
          - 'collect'
      samples:
        description: '最终深标样本数'
        required: true
        default: '8'
        type: choice
        options:
          - '8'
          - '16'
          - '32'
          - '64'
      depth:
        description: '教师搜索深度'
        required: true
        default: '2'
        type: choice
        options:
          - '2'
          - '3'
          - '4'
      seed:
        description: '随机种子'
        required: true
        default: '20260921'
        type: string

permissions:
  contents: read

jobs:
  teacher:
    name: V8 Teacher · ${{ inputs.mode }} · ${{ inputs.samples }}样本 · 深度${{ inputs.depth }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 读取仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 运行教师数据采集
        env:
          MODE: ${{ inputs.mode }}
          SAMPLES: ${{ inputs.samples }}
          DEPTH: ${{ inputs.depth }}
          SEED: ${{ inputs.seed }}
        run: node trainer/v8_teacher.mjs --mode "$MODE" --samples "$SAMPLES" --depth "$DEPTH" --seed "$SEED"

      - name: 显示摘要
        if: always()
        run: |
          if [ -f v8-teacher-results/summary.md ]; then
            cat v8-teacher-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 保存教师数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wudafang-v8-teacher-${{ inputs.mode }}-s${{ inputs.samples }}-d${{ inputs.depth }}
          path: v8-teacher-results/
          if-no-files-found: warn
          retention-days: 30
